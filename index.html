<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/aparadhkavach-logo.png" />
    <title>AparadhKavach — Repeat-Offender Risk Lookup</title>
    <!--
      D-099: `/accounts/logout` is served as this SPA. Catalyst clears `_iamadt_client_*` with
      Domain=…nimbuspop.com — effective only on the Nimbus host. Upgrade onslate/executor →
      Nimbus first (Set-Cookie applies before this script), then Nimbus → portal.
    -->
    <script>
      (function () {
        try {
          var path = (location.pathname || "").toLowerCase();
          var host = (location.hostname || "").toLowerCase();
          if (path.indexOf("/accounts/logout") === -1) return;
          if (host.indexOf("zohoportal") !== -1) return;
          var rest = location.pathname + location.search + location.hash;
          if (host.indexOf("nimbuspop.com") === -1) {
            location.replace("https://slate-6487000000004048-in.nimbuspop.com" + rest);
            return;
          }
          location.replace("https://accounts.zohoportal.in" + rest);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
